[tasks.serve]
description = "Run the render-engine dev server"
run = "uvx --with=render-engine render-engine serve app:app"

[tasks.build]
description = "Build the static site with render-engine"
run = "uv run render-engine build app:app"

[tasks.test]
description = "Run the test suite with pytest"
run = "uv run pytest"

[tasks.docker-build]
description = "Build the runtime image, passing GITHUB_TOKEN (via fnox) as a build secret so the manifest enrichment isn't rate-limited"
run = "fnox exec -- docker build --secret id=github_token,env=GITHUB_TOKEN --label name=runs-on-runtime -t runs-on-runtime ."

[tasks.docker-run]
description = "Run the runtime image locally on :8001, killing any previous instance first"
run = "docker rm -f runs-on-runtime 2>/dev/null; docker run --rm --name runs-on-runtime --label name=runs-on-runtime -p 8001:80 runs-on-runtime"
