<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ SITE_TITLE }}{% endblock %}</title>
  <!-- UMAMI TRACKER -->
  <script defer src="https://01a0667a-22d0-751d-9e2e-8eae7b180001-3000.eur-1.aiven.app/script.js" data-website-id="700a24c6-ae13-40b0-a098-668781744eac"></script>
  <script defer src="https://01a0667a-22d0-751d-9e2e-8eae7b180001-3000.eur-1.aiven.app/recorder.js" data-website-id="700a24c6-ae13-40b0-a098-668781744eac"></script>
  <link rel="stylesheet" href="/static/css/style.css">

<body style="display:flex;flex-direction:column;min-height:100vh">
  <header class="site-header">
    <div class="inner">
      <a class="site-title" href="/">
        <img src="/static/images/aiven-logo-white.svg" alt="Aiven">
        <span class="sep"></span>
        <span class="wordmark">Runs on Runtime</span>
      </a>
      <nav>
        <a class="btn btn-secondary" href="https://github.com/aiven-labs/runs-on-runtime" target="_blank" rel="noreferrer">GitHub</a>
        <a class="btn btn-primary" href="/contribute.html">Add a project</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="inner">
      <img src="/static/images/aiven-logo-white.svg" alt="Aiven">
      <span>Runs on Runtime. Built and hosted on Aiven Runtime.</span>
      <a class="edit-link" href="https://github.com/aiven-labs/runs-on-runtime/edit/main/data/manifest.json">
        Edit the manifest on GitHub &#8599;
      </a>
    </div>
